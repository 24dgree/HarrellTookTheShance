<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dcecff">
<title>RelShan — #HarrellTookTheShance Brick Studio</title>
<style>
:root{--ink:#172b48;--muted:#71819a;--blue:#a9c9ee;--pale:#eef5ff;--line:#dce6f2;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f9ff,#e8f1fc 55%,#f8fbff);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:1080px;margin:auto;padding:24px 18px 42px}
header{text-align:center;padding:10px 0 20px}
.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#6986aa;font-weight:800}
h1{font-family:Georgia,serif;font-weight:500;letter-spacing:1px;font-size:clamp(28px,5vw,46px);margin:8px 0 5px}
.sub{color:#6e7f98;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.12fr);gap:18px;align-items:start}
.preview,.editor{background:rgba(255,255,255,.88);border:1px solid #e0e9f5;border-radius:24px;box-shadow:0 14px 40px #8da8c51c}
.preview{padding:18px;position:sticky;top:14px}
.previewtop{display:flex;justify-content:space-between;align-items:center}
.label{font-size:10px;letter-spacing:2px;font-weight:800;color:#8294ad}
.pill{font-size:10px;color:#58769d;background:#edf4fd;padding:7px 10px;border-radius:30px;font-weight:700}

 .stage{
  position:relative;
}

.stage:before{
  content:"#HarrellTookTheShance";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-family:Georgia,serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:2px;
  color:#dce7f5;
  white-space:nowrap;
  z-index:0;
  pointer-events:none;
}

#figure{
  position:relative;
  z-index:1;
}
 
 #figure{width:min(100%,310px);height:370px;display:block}
.namebox{text-align:center;margin:0 0 12px}
.namebox input{border:0;border-bottom:1px solid #d8e3f0;background:transparent;text-align:center;font:600 15px inherit;color:var(--ink);width:70%;padding:8px;outline:none}
.actions{display:flex;gap:9px}
button{font:inherit;cursor:pointer}
.primary,.secondary{border:0;border-radius:13px;padding:12px 15px;font-weight:800;font-size:12px}
.primary{background:#243e63;color:white;flex:1;box-shadow:0 5px 14px #243e6326}
.secondary{background:#edf4fc;color:#385474}
.editor{padding:18px}
.switch{display:flex;background:#eff4fa;padding:5px;border-radius:14px;gap:5px;margin-bottom:16px}
.switch button{flex:1;border:0;background:transparent;color:#72839a;padding:11px 8px;border-radius:10px;font-weight:800;font-size:12px}
.switch button.active{background:white;color:#203b60;box-shadow:0 2px 8px #19385c12}
.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px}
.tab{border:1px solid #dce6f2;background:white;border-radius:30px;padding:8px 12px;color:#667b97;font-size:11px;font-weight:800}
.tab.active{background:#e8f1fc;border-color:#b9d0ec;color:#25466f}
.section{padding-top:16px}
.section h3{font-size:12px;margin:0 0 11px;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{border:1px solid #e0e8f2;background:#fff;border-radius:13px;padding:11px 8px;text-align:left;min-height:62px;color:#334d6e}
.choice strong{display:block;font-size:11px;line-height:1.25}
.choice small{display:block;color:#8796aa;font-size:9px;margin-top:4px}
.choice.selected{border:1.5px solid #739bc9;background:#f0f6ff;box-shadow:0 0 0 2px #dceafa}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d5dfeb;position:relative}
.swatch.selected{box-shadow:0 0 0 2px #668dbb}
.swatch.selected:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:13px;text-shadow:0 1px 3px #333}
.hint{display:block;color:#8796aa;font-size:10px;line-height:1.5;margin-top:7px}.note{margin-top:16px;padding:12px 13px;border-radius:13px;background:#f4f8fd;color:#7789a2;font-size:10px;line-height:1.5}
footer{text-align:center;color:#9aa9bb;font-size:10px;margin-top:18px;letter-spacing:1px}
@media(max-width:760px){.wrap{padding:16px 12px 28px}.layout{grid-template-columns:1fr}.preview{position:relative;top:auto}.stage{min-height:320px}#figure{height:320px}.editor{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="eyebrow">A little piece of our day</div><h1>RelShan Brick Studio</h1><div class="sub">Build your own little wedding guest</div></header>
<main class="layout">
<section class="preview">
 <div class="previewtop"><span class="label">YOUR MINIFIGURE</span><span class="pill">#HarrellTookTheShance</span></div>
 <div class="stage"><svg id="figure" viewBox="0 0 300 370" role="img" aria-label="Your custom wedding minifigure"></svg></div>
 <div class="namebox"><input id="guestName" maxlength="24" placeholder="Give your minifigure a name"></div>
 <div class="actions"><button class="primary" id="download">DOWNLOAD PNG</button><button class="secondary" id="random">SURPRISE ME</button></div>
 <div class="note">Your design is created in this browser. Nothing is uploaded or stored on a server.</div>
</section>
<section class="editor">
 <div class="switch"><button class="active" data-gender="male">GENTLEMAN</button><button data-gender="female">LADY</button></div>
 <div class="tabs" id="tabs">

  <div class="tabs" id="tabs">
  <button class="tab active" data-tab="hair">Hair</button>
  <button class="tab" data-tab="face">Expression</button>
  <button class="tab" data-tab="outfit">Outfit</button>
  <button class="tab" data-tab="tie">Tie</button>
  <button class="tab" data-tab="accessories">Accessories</button>
  <button class="tab" data-tab="pose">Pose</button>
   
  <button class="tab" data-tab="props">Details</button>
   
  </div>
 
 </div>

 
 <div id="controls"></div>
</section>
</main>
<footer>MADE WITH LOVE · WEDDING GUEST EDITION</footer>
</div>
<script>

 const state={
 gender:'male',
 hair:'Side part',
 babyHair:false,
 face:'Smug',
 outfit:'Full suit',
 color:'navy',
 tie:'Necktie',
 belt:'Plain',
 hairColor:'#3b2a23',
 skin:'#f2c49b',
 accessories:[],
 accessoryColor:'#ffffff',
 glassesStyle:'Original',
 watchStyle:'Brown leather · black oval-square',
 giftStyle:0,
 pinColor:'#ffffff',
 purseColor:'#e8b9c2',
 earringColor:'#ffffff',
 fanColor:'#ffffff',
 pose:'Classic stance',
 props:[]
};
 
 const palettes={
 male:[
  ['Navy','#182c4d'],
  ['Black','#20232b'],
  ['White','#f4f4f1'],
  ['Blue','#a9c9e9'],
  ['Blush pink','#e8b9c2']
 ],
 female:[
  ['White','#f8f7f2'],
  ['Cream','#e9dfcc'],
  ['Black','#20232b'],
  ['Baby blue','#b9d5f0'],
  ['Blush pink','#e8b9c2'],
  ['Soft olive','#cbd3a5']
 ]
};
 const options={
 hair:{male:['Side part','Middle part','Textured short','Wavy','Slick back','Classic short'],female:['Smooth full-front waves','Loose curls','Low chignon','Elegant updo','Elegant centre-part waves','Long sleek straight','Soft Hollywood waves','Half-up waves']},
 face:['Smug','Playful tongue','Neutral','Wink','Blush','Mustache'],
 
  
  outfit:{
 male:[
  'Full suit',
  'Reserved for Harrell',
  'Suit + bowtie',
  'Fitted vest + shirt',
  'Vest + necktie',
  'Vest + bowtie'
 ],
 female:[
  'Blouse + A-line skirt',
  'Sweetheart strapless gown',
  'Sheer cape gown',
  'Off-shoulder fitted gown',
  'A-line satin gown',
  'Mermaid gown',
  'One-shoulder gown',
  'Tulle ball gown',
  'Long-sleeve fitted gown'
 ]
},
 
  
  tie:['Necktie','Bowtie','No tie'],
 accessories:['Glasses','Watch','Gift box','Balinese paper parasol','Boutonniere','Round pin','Hair clip','Earrings','Open fan','Bouquet'],
 hairColors:[['Espresso','#3b2a23'],['Black','#17191e'],['Chestnut','#805037'],['Blonde','#d7b36c'],['Auburn','#9b4932'],['Silver','#b8bdc7']],
 skins:[['Warm','#f2c49b'],['Light','#f7d7bd'],['Tan','#c98e65'],['Deep','#8d5944']]
};
let tab='hair';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function card(label,selected,sub=''){return `<button class="choice ${selected?'selected':''}" data-choice="${esc(label)}"><strong>${esc(label)}</strong>${sub?`<small>${sub}</small>`:''}</button>`}
function renderControls(){
 const root=document.getElementById('controls');let out='';
 if(tab==='hair'){
  const mainHair=options.hair[state.gender];
  out+=`<div class="section"><h3>HAIRSTYLE</h3><div class="grid">${mainHair.map(x=>card(x,state.hair===x)).join('')}</div></div>`;
  out+=`<div class="section"><h3>HAIR DETAIL</h3><div class="grid">${card('Baby hair',state.babyHair)}</div><small class="hint">Baby hair mengikuti lengkung rambut di mahkota, menyatu dengan helaian rambut dan tidak menyentuh dahi.</small></div>`;
  out+=`<div class="section"><h3>HAIR COLOUR</h3><div class="swatches">${options.hairColors.map(([n,c])=>`<button class="swatch ${state.hairColor===c?'selected':''}" title="${n}" data-haircolor="${c}" style="background:${c}"></button>`).join('')}</div></div>`;
 } else if(tab==='face'){
  out+=`<div class="section"><h3>FACIAL EXPRESSION</h3><div class="grid">${options.face.map(x=>card(x,state.face===x)).join('')}</div></div>`;
  out+=`<div class="section"><h3>SKIN TONE</h3><div class="swatches">${options.skins.map(([n,c])=>`<button class="swatch ${state.skin===c?'selected':''}" title="${n}" data-skin="${c}" style="background:${c}"></button>`).join('')}</div></div>`;
 } else if(tab==='outfit'){
  out+=`<div class="section"><h3>${state.gender==='male'?'FORMAL MENSWEAR':'FORMAL DRESSES'}</h3><div class="grid">${options.outfit[state.gender].map(x=>card(x,state.outfit===x)).join('')}</div></div>`;
  
  
  if(state.outfit!=='Reserved for Harrell'){
 out+=`<div class="section"><h3>OUTFIT COLOUR</h3><div class="swatches">${palettes[state.gender].map(([n,c])=>`<button class="swatch ${state.color===n.toLowerCase()?'selected':''}" title="${n}" data-color="${n.toLowerCase()}" style="background:${c}"></button>`).join('')}</div></div>`;
  }

 
 } else if(tab==='pose'){
  const poses=['Classic stance','One hand waving','Hands on hips','Hands together'];
  out+=`<div class="section"><h3>MINIFIGURE POSE</h3><div class="grid">${poses.map(x=>card(x,state.pose===x)).join('')}</div></div>`;
 
  } else if(tab==='props'){
  const propOptions=[
   '#London',
   '#261226',
   '#HappyWeekend',
   '#Bali',
   '#080127',
   '#TGIF'
  ];

  out+=`<div class="section">
   <h3>DETAILS · PICK UP TO 3</h3>
   <div class="grid">
    ${propOptions.map(x=>card(x,state.props.includes(x))).join('')}
   </div>
   <small class="hint">
    Choose up to three wordings. Tap again to remove one.
   </small>
  </div>`;

 
} else if(tab==='tie'){
 if(state.gender==='male'){
  out+=`<div class="section">
   <h3>NECKWEAR</h3>
   <div class="grid">
    ${options.tie.map(x=>card(x,state.tie===x)).join('')}
   </div>
  </div>`;
 }else{
  const beltOptions=['Plain','Ribbon','Bow'];
  out+=`<div class="section">
   <h3>DRESS BELT</h3>
   <div class="grid">
    ${beltOptions.map(x=>card(x,state.belt===x)).join('')}
   </div>
   <small class="hint">Belt colour automatically matches your dress.</small>
  </div>`;
 }

 } else if(tab==='accessories'){
  const accessoryOptions=state.gender==='male'?['Glasses','Watch','Gift box','Balinese paper parasol','Boutonniere','Round pin']:['Glasses','Gift box','Balinese paper parasol','Open fan','Hair clip','Earrings','Bouquet'];
  out+=`<div class="section"><h3>ACCESSORIES · PICK UP TO 3</h3><div class="grid">${accessoryOptions.map(x=>card(x,state.accessories.includes(x))).join('')}</div><small class="hint">Choose up to three accessories. Tap again to remove one.</small></div>`;
  
  
  if(state.accessories.includes('Glasses'))out+=`<div class="section"><h3>GLASSES STYLE</h3><div class="grid">${['Original','White heart · dark lenses','Long rectangle · dark lenses','Olive oval · clear lenses'].map((x,i)=>card(x,state.glassesStyle===x)).join('')}</div></div>`;
  if(state.gender==='male'&&state.accessories.includes('Watch'))out+=`<div class="section"><h3>WATCH STYLE</h3><div class="grid">${['Brown leather · black oval-square','Black leather · round'].map(x=>card(x,state.watchStyle===x)).join('')}</div></div>`;
  if(state.accessories.includes('Gift box'))out+=`<div class="section"><h3>GIFT BOX COLOUR</h3><div class="grid">${['White box · baby blue ribbon','Black box · cream ribbon','Blue box · white ribbon'].map((x,i)=>card(x,state.giftStyle===i)).join('')}</div></div>`;
  if(state.gender==='male'&&state.accessories.includes('Round pin'))out+=`<div class="section"><h3>PIN COLOUR</h3><div class="swatches"><button class="swatch ${state.pinColor==='#ffffff'?'selected':''}" title="White" data-pin="#ffffff" style="background:#fff"></button><button class="swatch ${state.pinColor==='#b9d5f0'?'selected':''}" title="Baby blue" data-pin="#b9d5f0" style="background:#b9d5f0"></button></div></div>`;
  if(state.gender==='female'&&state.accessories.includes('Open fan'))out+=`<div class="section"><h3>FAN COLOUR</h3><div class="swatches">${[['Brown','#805037'],['Baby blue','#b9d5f0'],['White','#f8f7f2']].map(([n,c])=>`<button class="swatch ${state.fanColor===c?'selected':''}" title="${n}" data-fan="${c}" style="background:${c}"></button>`).join('')}</div></div>`;
  if(state.gender==='female'&&state.accessories.includes('Earrings'))out+=`<div class="section"><h3>EARRING COLOUR</h3><div class="swatches"><button class="swatch ${state.earringColor==='#ffffff'?'selected':''}" title="Pearl white" data-earring="#ffffff" style="background:#fff"></button><button class="swatch ${state.earringColor==='#d6b36c'?'selected':''}" title="Gold" data-earring="#d6b36c" style="background:#d6b36c"></button></div></div>`;
  if(state.accessories.includes('Hair clip'))out+=`<div class="section"><h3>HAIR CLIP COLOUR</h3><div class="swatches"><button class="swatch ${state.accessoryColor==='#ffffff'?'selected':''}" title="White" data-acccolor="#ffffff" style="background:#fff"></button><button class="swatch ${state.accessoryColor==='#17191e'?'selected':''}" title="Black" data-acccolor="#17191e" style="background:#17191e"></button></div></div>`;
  
   
 
    }
 
 root.innerHTML=out;
 
 root.querySelectorAll('[data-choice]').forEach(b=>{
  b.onclick=()=>{
   let v=b.dataset.choice;

   if(tab==='hair'){
    if(v==='Baby hair'){
     state.babyHair=!state.babyHair;
    }else{
     state.hair=v;
    }

   }else if(tab==='face'){
    state.face=v;

   }else if(tab==='outfit'){
    state.outfit=v;

    if(v.toLowerCase().includes('bowtie')){
     state.tie='Bowtie';
    }else if(v.toLowerCase().includes('necktie')){
     state.tie='Necktie';
    }

   }else if(v==='Plain'||v==='Ribbon'||v==='Bow'){
 state.belt=v;
}else if(v==='Necktie'||v==='Bowtie'||v==='No tie'){
 state.tie=v;

   }else if([
    'Original',
    'White heart · dark lenses',
    'Long rectangle · dark lenses',
    'Olive oval · clear lenses'
   ].includes(v)){
    state.glassesStyle=v;

   }else if([
    'Brown leather · black oval-square',
    'Black leather · round'
   ].includes(v)){
    state.watchStyle=v;

   }else if([
    'White box · baby blue ribbon',
    'Black box · cream ribbon',
    'Blue box · white ribbon'
   ].includes(v)){
    state.giftStyle=[
     'White box · baby blue ribbon',
     'Black box · cream ribbon',
     'Blue box · white ribbon'
    ].indexOf(v);

   }else if([
    'Classic stance',
    'One hand waving',
    'Hands on hips',
    'Hands together'
   ].includes(v)){
    state.pose=v;

   }else if([
    '#London',
    '#261226',
    '#HappyWeekend',
    '#Bali',
    '#080127',
    '#TGIF'
   ].includes(v)){
    if(state.props.includes(v)){
     state.props=state.props.filter(x=>x!==v);
    }else if(state.props.length<3){
     state.props.push(v);
    }

   }else{
    if(state.accessories.includes(v)){
     state.accessories=state.accessories.filter(x=>x!==v);
    }else if(state.accessories.length<3){
     state.accessories.push(v);
    }
   }

   renderControls();
   draw();
  };
 });
 
 
 root.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;renderControls();draw()});
 root.querySelectorAll('[data-haircolor]').forEach(b=>b.onclick=()=>{state.hairColor=b.dataset.haircolor;renderControls();draw()});
 root.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.skin=b.dataset.skin;renderControls();draw()});
 root.querySelectorAll('[data-acccolor]').forEach(b=>b.onclick=()=>{state.accessoryColor=b.dataset.acccolor;renderControls();draw()});
 root.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{state.pinColor=b.dataset.pin;renderControls();draw()});
 root.querySelectorAll('[data-purse]').forEach(b=>b.onclick=()=>{state.purseColor=b.dataset.purse;renderControls();draw()});
 root.querySelectorAll('[data-fan]').forEach(b=>b.onclick=()=>{state.fanColor=b.dataset.fan;renderControls();draw()});
 root.querySelectorAll('[data-earring]').forEach(b=>b.onclick=()=>{state.earringColor=b.dataset.earring;renderControls();draw()});
}
function draw(){
 const male=state.gender==='male', skin=state.skin, hair=state.hairColor;
 const colorMap={navy:'#182c4d',black:'#20232b',white:'#f4f4f1',blue:'#a9c9e9','baby blue':'#b9d5f0','blush pink':'#e8b9c2','soft olive':'#cbd3a5',cream:'#e9dfcc'};
 
 const c=state.outfit==='Reserved for Harrell'
 ? '#20232b'
 : (colorMap[state.color]||'#182c4d');
 
 const outline='#263750';
 let torso='',legs='',arms='',tie='',extra='';
 if(male){
  const vest=state.outfit.startsWith('Fitted vest')||state.outfit.startsWith('Vest');
  const jacket=!vest;
  const sleeveColor=jacket?c:'#f7f7f4';
  
  // Arms are drawn behind the torso. Shirt/jacket sleeves follow the shoulder line and end at the wrist.

  arms=`
 ${state.outfit==='Reserved for Harrell'?`
 <path
  d="M109 239
  C91 246 88 255 101 261
  C130 275 183 264 207 247
  Q218 240 216 232"
  fill="none"
  stroke="#c99ba4"
  stroke-width="11"
  stroke-linecap="round"
  stroke-linejoin="round"
 />
 <path
  d="M109 239
  C91 246 88 255 101 261
  C130 275 183 264 207 247
  Q218 240 216 232"
  fill="none"
  stroke="#e8b9c2"
  stroke-width="8"
  stroke-linecap="round"
  stroke-linejoin="round"
 />`
 :''}

 <g stroke-linecap="round" stroke-linejoin="round">
  <path d="M105 169 Q96 174 91 190 L84 232"
   fill="none" stroke="${outline}" stroke-width="25"/>
  <path d="M105 169 Q96 174 91 190 L84 232"
   fill="none" stroke="${sleeveColor}" stroke-width="19"/>

  <path d="M195 169 Q204 174 209 190 L216 232"
   fill="none" stroke="${outline}" stroke-width="25"/>
  <path d="M195 169 Q204 174 209 190 L216 232"
   fill="none" stroke="${sleeveColor}" stroke-width="19"/>

  <path d="M84 232 L82 248 M216 232 L218 248"
   fill="none" stroke="${outline}" stroke-width="22"/>
  <path d="M84 233 L82 247 M216 233 L218 247"
   fill="none" stroke="${skin}" stroke-width="15"/>
 </g>`;
  
  
  legs=`<path d="M105 255 H150 V333 H112 Q105 333 105 325Z" fill="${c}" stroke="${outline}" stroke-width="3"/><path d="M150 255 H195 V325 Q195 333 188 333 H150Z" fill="${c}" stroke="${outline}" stroke-width="3"/><path d="M106 320 H150 M150 320 H194" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>`;
  if(jacket){
   torso=`<path d="M105 155 L137 155 L150 178 L163 155 L195 155 Q207 161 210 180 L197 258 H103 L90 180 Q93 161 105 155Z" fill="${c}" stroke="${outline}" stroke-width="3"/>
    <path d="M137 155 L150 178 L139 216 L116 163Z" fill="#fff" stroke="#cbd3df" stroke-width="1.2"/><path d="M163 155 L150 178 L161 216 L184 163Z" fill="#fff" stroke="#cbd3df" stroke-width="1.2"/>
    <path d="M150 179 V252" stroke="#d8dfeb" stroke-width="1.5"/><circle cx="160" cy="226" r="2" fill="#d8dfeb"/><path d="M177 169 L190 169 L184 181Z" fill="#fff"/>`;
  }else{
   // A fitted waistcoat sits inside the torso silhouette; it narrows at the waist instead of floating over it.
   torso=`<path d="M105 155 L137 155 L150 176 L163 155 L195 155 Q207 161 210 180 L197 258 H103 L90 180 Q93 161 105 155Z" fill="#f7f7f4" stroke="${outline}" stroke-width="3"/>
    <path d="M116 158 L145 171 L150 250 L107 250 L101 181Z" fill="${c}" stroke="${outline}" stroke-width="2.2"/><path d="M184 158 L155 171 L150 250 L193 250 L199 181Z" fill="${c}" stroke="${outline}" stroke-width="2.2"/>
    <path d="M116 158 L145 171 L150 188 L136 180Z M184 158 L155 171 L150 188 L164 180Z" fill="${c}" stroke="${outline}" stroke-width="1.5"/>
    <path d="M150 190 V242" stroke="#d7dce4" stroke-width="1.2"/>${[202,216,230].map(y=>`<circle cx="158" cy="${y}" r="1.8" fill="#e8edf4"/>`).join('')}`;

 document.getElementById('download').onclick=()=>{
 const button=document.getElementById('download');
 button.disabled=true;
 button.textContent='PREPARING...';

 const svg=document.getElementById('figure').cloneNode(true);

 svg.setAttribute('xmlns','http://www.w3.org/2000/svg');

 const source=new XMLSerializer().serializeToString(svg);

 const svgBlob=new Blob(
  [source],
  {type:'image/svg+xml;charset=utf-8'}
 );

 const svgURL=URL.createObjectURL(svgBlob);
 const img=new Image();

 img.onload=()=>{
  const canvas=document.createElement('canvas');

  canvas.width=900;
  canvas.height=1110;

  const ctx=canvas.getContext('2d');

  ctx.fillStyle='#f5f9ff';
  ctx.fillRect(0,0,900,1110);

  ctx.drawImage(img,0,0,900,1110);

  ctx.fillStyle='#243e63';
  ctx.textAlign='center';
  ctx.font='bold 34px Arial';

  const name=document.getElementById('guestName').value.trim();

  if(name){
   ctx.fillText(name,450,1060);
  }

  ctx.font='18px Arial';
  ctx.fillStyle='#7890ad';

  ctx.fillText(
   '#HarrellTookTheShance Brick Studio',
   450,
   1090
  );

  canvas.toBlob(blob=>{
   URL.revokeObjectURL(svgURL);

   if(!blob){
    alert('PNG could not be created. Please try again.');
    button.disabled=false;
    button.textContent='DOWNLOAD PNG';
    return;
   }

   const pngURL=URL.createObjectURL(blob);
   const link=document.createElement('a');

   link.href=pngURL;
   link.download='my-wedding-minifigure.png';

   document.body.appendChild(link);
   link.click();
   link.remove();

   setTimeout(()=>{
    URL.revokeObjectURL(pngURL);
   },3000);

   button.disabled=false;
   button.textContent='DOWNLOAD PNG';

  },'image/png');
 };

 img.onerror=()=>{
  URL.revokeObjectURL(svgURL);
  button.disabled=false;
  button.textContent='DOWNLOAD PNG';
  alert('Unable to create image. Please try another browser.');
 };

 img.src=svgURL;
};
 
renderControls();draw();
</script>
